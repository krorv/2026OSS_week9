<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>친구 관리</title>
    <style>
        body {
            background-color: #e9d8d7;
            margin: 20px;
            max-width: 800px;
            padding: 20px;
        }
        h2 { color: black; }
        div { margin-bottom: 20px; }
        input, button { margin: 5px; padding: 5px; }
        table {
            background-color: white;
            width: 100%;
            border-collapse: collapse;
        }
        th, td { padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }   
        .edit-btn, .delete-btn {
            background-color: #d5618e;  
            color: white;
            border: none;
            padding: 5px 10px;
        }
        tr:hover { background-color: #f0f0f0; }
        button:hover { opacity: 0.8; cursor: pointer; }
        .search-container {
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <a href="index.html">← 홈으로</a>
    <h2>친구 추가 / 수정</h2>
    <div>
        <input type="hidden" id="edit-id">
        <input type="text" id="name" placeholder="이름">
        <input type="text" id="relation" placeholder="관계">
        <input type="text" id="phone" placeholder="전화번호">
        <input type="email" id="email" placeholder="이메일">
        <input type="date" id="birthday">
        <button id="submit-btn" onclick="addOrUpdateFriend()">추가</button>
        <button id="cancel-btn" onclick="resetForm()" style="display:none;">취소</button>
    </div>

    <hr>
    
    <h2>친구 목록</h2>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="이름 또는 관계 검색..." oninput="searchFriends()">
    </div>
    <p id="message" style="color: #c0392b;"></p>
    <table border="1">
        <thead>
            <tr>
                <th>이름</th>
                <th>관계</th>
                <th>전화번호</th>
                <th>이메일</th>
                <th>생일</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
        </thead>
        <tbody id="friendList">
        </tbody>
    </table>

    <script>
    const API_URL = "https://6adea6de4e88f1bba4a53a3b.mockapi.io/Friends";
    let friends = [];   // 화면 표시용
    let editingId = null;
    //서버에서 목록 가져오기
    async function loadFriends() {
        try {
            const response = await fetch(API_URL);//response로 받아오기
            if (!response.ok) {//만약 없으면?
                throw new Error(`서버 오류 (${response.status})`)//에러메세지
            }
            friends = await response.json();//json type으로 변환
            renderFriends(friends);//renderFriends에 보내기
            showMessage("");//메세지 없애기
        } catch (error) {
            showMessage("목록을 불러오지 못했어요: " + error.message);
        }
    }

   //배열을 표로 바꾸기
    function renderFriends(list) {
        const tbody = document.getElementById("friendList");
        let html = "";

        for (const f of list) {
            html += `<tr>
                        <td>${f.name}</td>
                        <td>${f.relationship || f.relation || ""}</td>
                        <td>${f.phone}</td>
                        <td>${f.email}</td>
                        <td>${f.birthdate || f.birthday || ""}</td>
                        <td><button class="edit-btn" onclick="startEdit('${f.id}')">수정</button></td>
                        <td><button class="delete-btn" onclick="deleteFriend('${f.id}')">삭제</button></td>
                     </tr>`;
        }

        tbody.innerHTML = html;
    }

    //오류 메시지 출력
    function showMessage(text) {
        document.getElementById("message").textContent = text;
    }

    async function addFriend(friend) {
        const response = await fetch(API_URL, {
            method: "POST",//post로 추가!
            headers: {
                "Content-Type": "application/json"//json type으로 보내겟다
            },
            body: JSON.stringify(friend)//json 들어있음
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        await loadFriends();//추가 후에 다시 불러오기..
    }
    async function addOrUpdateFriend() {
    const friend = {
        name: document.querySelector("#name").value,
        relation: document.querySelector("#relation").value,
        phone: document.querySelector("#phone").value,
        email: document.querySelector("#email").value,
        birthday: document.querySelector("#birthday").value
    };

    // 입력값 검증 통과 못하면 중단
    if (!validateForm(friend)) return;

    try {
        if (editingId === null) {
            await addFriend(friend);                  // 추가
        } else {
            await updateFriend(editingId, friend);    // 수정
        }

        resetForm(); // 입력창 초기화
        showMessage("");
    } catch (error) {
        showMessage("요청 실패: " + error.message);
    }
}
    function startEdit(id) {
        const target = friends.find(f => f.id === id);
        if (!target) return;

        editingId = id;
        document.querySelector("#name").value = target.name;
        document.querySelector("#relation").value = target.relationship || target.relation || "";
        document.querySelector("#phone").value = target.phone;
        document.querySelector("#email").value = target.email;
        document.querySelector("#birthday").value = target.birthdate || target.birthday || "";

        document.querySelector("#submit-btn").textContent = "수정 완료";
        document.querySelector("#cancel-btn").style.display = "inline-block";
    }

    // 폼 초기화
    function resetForm() {
        document.querySelector("#name").value = "";
        document.querySelector("#relation").value = "";
        document.querySelector("#phone").value = "";
        document.querySelector("#email").value = "";
        document.querySelector("#birthday").value = "";

        editingId = null;
        document.querySelector("#submit-btn").textContent = "추가";
        document.querySelector("#cancel-btn").style.display = "none";
        showMessage("");
    }
    async function updateFriend(id, updatedData) {
        const response = await fetch(`${API_URL}/${id}`, {  
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(updatedData)
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        await loadFriends();
    }
    async function deleteFriend(id) {
        if (!confirm("정말 삭제하시겠습니까?")) {
            return;                                   
        }

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"                      
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadFriends();                      
            showMessage("");
        } catch (error) {
            showMessage("삭제 실패: " + error.message);
        }
    }
    function validateForm(friend) {
    if (!friend.name || !friend.relation || !friend.phone || !friend.email || !friend.birthday)
     {
        showMessage("모든 필드를 입력해 주세요.");
        return false;
    }

    if (friend.name.trim().length < 2) {
        showMessage("이름은 최소 2글자 이상이어야 합니다.");
        return false;
    }

    if (friend.phone.trim().length < 9) {
        showMessage("전화번호는 최소 9자리 이상이어야 합니다.");
        return false;
    }

    if (!friend.email.includes("@")) {
        showMessage("이메일 형식이 올바르지 않습니다. (@ 포함)");
        return false;
    }

    return true;
}
    
    function searchFriends() {
        const query = document.querySelector("#searchInput").value.toLowerCase();
        const filtered = friends.filter(f => 
            f.name.toLowerCase().includes(query) || 
            f.relation.toLowerCase().includes(query)
        );
        renderFriends(filtered);
    }

    // 최초 실행
    loadFriends();

</script>
</body>
</html>
